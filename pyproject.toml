[project]
name = "notsofastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "therappha", email = "therappha@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1,<=9.2",
]

[project.scripts]
notsofastapi = "notsofastapi:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
testpaths = [
    "tests",
]
